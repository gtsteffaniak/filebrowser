name: Build ARM64

on:
  push:
    branches:
      - "v2.1.0-arm64"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build FileBrowser ARM64
    runs-on: ubuntu-24.04-arm

    steps:
      # ----------------------------------------
      # 1. NEUEN DEV-STAND holen
      # ----------------------------------------
      - name: Checkout FileBrowser dev/v2.1.0
        uses: actions/checkout@v4
        with:
          repository: gtsteffaniak/filebrowser
          ref: dev/v2.1.0

      # ----------------------------------------
      # 2. Node.js / Frontend
      # ----------------------------------------
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc

      - name: Build frontend
        working-directory: frontend
        run: |
          npm i
          npm run build

      # ----------------------------------------
      # 3. Go / ARM64 Binary
      # ----------------------------------------
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Build ARM64 binary
        working-directory: backend
        run: |
          go build \
            -o filebrowser \
            --ldflags="-w -s -X 'github.com/gtsteffaniak/filebrowser/backend/internal/version.Version=v2.1.0'"

      # ----------------------------------------
      # 4. ARM64 Binary als Download
      # ----------------------------------------
      - name: Upload ARM64 binary
        uses: actions/upload-artifact@v4
        with:
          name: filebrowser-v2.1.0-linux-arm64
          path: backend/filebrowser

      # ----------------------------------------
      # 5. Docker Buildx
      # ----------------------------------------
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ----------------------------------------
      # 6. GHCR Login
      # ----------------------------------------
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ----------------------------------------
      # 7. Docker ARM64 Image
      # ----------------------------------------
      - name: Build and push ARM64 Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./_docker/Dockerfile.slim
          platforms: linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:v2.1.0-arm64
            ghcr.io/${{ github.repository }}:arm64
          build-args: |
            VERSION=v2.1.0
            REVISION=${{ github.sha }}
