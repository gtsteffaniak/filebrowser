# .goreleaser.yaml
project_name: filebrowser
version: 2

before:
  hooks:
    - go mod download
    - go run ./scripts/setup-gofitz-cgo

builds:
  # Build configuration for linux amd64
  - id: linux-amd64
    env:
      - CGO_ENABLED=1
      - CC=zig cc -target x86_64-linux-musl
    tags:
      - analytics
      - mupdf
      - musl
    ldflags: &ldflags
      - -s -w -X github.com/gtsteffaniak/filebrowser/backend/internal/version.Version=v{{ .Version }} -X github.com/gtsteffaniak/filebrowser/backend/internal/version.CommitSHA={{ .ShortCommit }}
    main: main.go
    binary: filebrowser
    goos:
      - linux
    goarch:
      - amd64
    hooks:
      post:
        - upx {{ .Path }}

  # Build configuration for linux arm64
  - id: linux-arm64
    ldflags: *ldflags
    main: main.go
    binary: filebrowser
    env:
      - CGO_ENABLED=1
      - CC=zig cc -target aarch64-linux-musl
    tags:
      - analytics
      - mupdf
      - musl
    goos:
      - linux
    goarch:
      - arm64
    hooks:
      post:
        - upx {{ .Path }}

  # Build configuration for linux
  - id: linux-arm32
    ldflags: *ldflags
    main: main.go
    binary: filebrowser
    tags:
      - analytics
    goos:
      - linux
    goarch:
      - arm
    goarm:
      - "6"
      - "7"
    hooks:
      post:
        - upx {{ .Path }}  # Compress the binary with UPX

  # Build configuration for windows without arm
  - id: windows
    env:
      - CGO_ENABLED=1
      # windows-gnu provides mingw headers; -lc links libc (required for CGO on Linux CI)
      - CC=zig cc -target x86_64-windows-gnu -lc
    tags:
      - analytics
      - mupdf
    ldflags: *ldflags
    main: main.go
    binary: filebrowser
    goos:
      - windows
    goarch:
      - amd64
    hooks:
      post:
        - upx {{ .Path }}  # Compress the binary with UPX

  # Build configuration for freebsd without arm & upx
  - id: freeBSD and freebsd-arm
    ldflags: *ldflags
    main: main.go
    binary: filebrowser
    tags:
      - analytics
    goos:
      - freebsd
    goarch:
      - amd64

  # Build configuration for macos without upx (clang cross-compile from Linux CI + macOS SDK)
  - id: macos-arm64
    env:
      - CGO_ENABLED=1
      - SDKROOT={{ .Env.SDK_PATH }}
      - MACOSX_DEPLOYMENT_TARGET=11.0
      - >-
        CGO_CFLAGS=-isysroot {{ .Env.SDK_PATH }} -mmacosx-version-min=11.0
      - >-
        CGO_CXXFLAGS=-isysroot {{ .Env.SDK_PATH }} -mmacosx-version-min=11.0
      - >-
        CGO_LDFLAGS=-isysroot {{ .Env.SDK_PATH }}
      - >-
        CC=clang --target=aarch64-apple-darwin -isysroot {{ .Env.SDK_PATH }} -mmacosx-version-min=11.0
      - >-
        CXX=clang++ --target=aarch64-apple-darwin -isysroot {{ .Env.SDK_PATH }} -mmacosx-version-min=11.0
    ldflags: *ldflags
    main: main.go
    binary: filebrowser
    tags:
      - analytics
      - mupdf
    goos:
      - darwin
    goarch:
      - arm64

  - id: macos-amd64
    env:
      - CGO_ENABLED=1
      - SDKROOT={{ .Env.SDK_PATH }}
      - MACOSX_DEPLOYMENT_TARGET=11.0
      - >-
        CGO_CFLAGS=-isysroot {{ .Env.SDK_PATH }} -mmacosx-version-min=11.0
      - >-
        CGO_CXXFLAGS=-isysroot {{ .Env.SDK_PATH }} -mmacosx-version-min=11.0
      - >-
        CGO_LDFLAGS=-isysroot {{ .Env.SDK_PATH }}
      - >-
        CC=clang --target=x86_64-apple-darwin -isysroot {{ .Env.SDK_PATH }} -mmacosx-version-min=11.0
      - >-
        CXX=clang++ --target=x86_64-apple-darwin -isysroot {{ .Env.SDK_PATH }} -mmacosx-version-min=11.0
    ldflags: *ldflags
    main: main.go
    binary: filebrowser
    tags:
      - analytics
      - mupdf
    goos:
      - darwin
    goarch:
      - amd64

archives:
  - name_template: >
      {{- if eq .Os "windows" -}}
      {{.ProjectName}}
      {{- else -}}
      {{.Os}}-{{.Arch}}{{if .Arm}}v{{.Arm}}{{end}}-{{.ProjectName}}
      {{- end -}}
    formats: [ 'binary' ]

checksum:
  disable: true
