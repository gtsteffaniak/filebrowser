# .goreleaser.yaml
project_name: filebrowser
version: 2

before:
  hooks:
    - go mod download

builds:
  - id: filebrowser
    main: main.go
    # Flat dist layout without GOAMD64/GOARM64/GORISCV64 suffix folders (e.g. _v1, _v8.0).
    no_unique_dist_dir: true
    binary: >-
      {{ .Os }}-{{ .Arch }}{{ if eq .Arch "arm" }}-{{ .Arm }}{{ end }}/filebrowser
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    tags:
      - analytics
    ldflags:
      - -s -w -X github.com/gtsteffaniak/filebrowser/backend/internal/version.Version=v{{ .Version }} -X github.com/gtsteffaniak/filebrowser/backend/internal/version.CommitSHA={{ .ShortCommit }}
    goos:
      - linux
      - windows
      - darwin
      - freebsd
    goarch:
      - amd64
      - arm64
      - arm
      - riscv64
    goarm:
      - "6"
      - "7"
    ignore:
      - goos: windows
        goarch: arm
      - goos: windows
        goarch: riscv64
      - goos: darwin
        goarch: arm
      - goos: darwin
        goarch: riscv64
      - goos: freebsd
        goarch: arm
      - goos: freebsd
        goarch: arm64
      - goos: freebsd
        goarch: riscv64

archives:
  - name_template: >
      {{- if eq .Os "windows" -}}
      {{.ProjectName}}{{ if ne .Arch "amd64" }}-{{ .Arch }}{{ end }}
      {{- else if eq .Arch "arm" -}}
      {{.Os}}-arm-{{ .Arm }}-{{.ProjectName}}
      {{- else -}}
      {{.Os}}-{{.Arch}}-{{.ProjectName}}
      {{- end -}}
    formats: ["tar.gz"]
    format_overrides:
      - goos: windows
        formats: ["zip"]
