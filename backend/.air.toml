root = "."
tmp_dir = "tmp"
env_files = [".air.env"]

[build]
  cmd = "bash ./scripts/air-build.sh"
  entrypoint = "./tmp/filebrowser"
  args_bin = ["-c", "test_config.yaml"]
  include_ext = ["go", "tpl", "tmpl", "html"]
  exclude_dir = ["tmp", "vendor", "internal/web/dist", "internal/web/embed", "internal/preview/testdata", "internal/preview/thumbnails", "internal/preview/heic", "swagger/docs", "internal/preview/gofitzinclude"]
  poll = true
  poll_interval = 1000
  log = "air.log"
  delay = 1000 # ms

[build.windows]
  cmd = "bash ./scripts/air-build.sh"
  entrypoint = "./tmp/filebrowser.exe"

[log]
  time = true

[misc]
  clean_on_exit = false
