http:
  port: 8080
  baseURL:  "/files/"
frontend:
  styling:
    disableEventThemes: true
auth:
  adminPassword: "playwright-password"

server:
  logging:
    - levels: "info|error|warning|debug"
      apiFilter: 'disabled'
  sources:
    - path: "../frontend/tests/playwright-files"
      name: "playwright"
      config:
        defaultEnabled: true
userDefaults:
  listing:
    viewMode: "normal"
    # Size 4: switch-view "gallery" family resolves to icons (not gallery); list family → list.
    gallerySize: 3
  account:
    showAdvancedProfile: true