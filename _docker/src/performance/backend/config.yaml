server:
  <<: *server-main
http:
  <<: *http-main
frontend:
  <<: *frontend-main
auth:
  <<: *auth-main
userDefaults:
  preview:
    image: true
    popup: true
    video: true
    audio: true
    models: true
    office: true
    highQuality: true
  account:
    permissions:
      share: true

integrations:
  media:
    # Keep the multi-second ffmpeg hardware codec probe out of CI startup.
    hardwareAcceleration: false
