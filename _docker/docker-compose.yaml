services:
  local-playwright:
    container_name: local-playwright
    ports:
      - "8080:8080"
    build:
      dockerfile: ./_docker/Dockerfile.playwright-local
      context: ../
  local-playwright-screenshots:
    container_name: local-playwright
    volumes:
      - ../frontend/generated:/app/frontend/generated
    entrypoint: ["/bin/sh", "-c", "./filebrowser & sleep 2 && cd ../frontend && npx playwright test --project dark-screenshots && npx playwright test --project light-screenshots"]
    build:
      dockerfile: ./_docker/Dockerfile.playwright-screenshots
      context: ../
  local-playwright-performance:
    container_name: local-playwright-performance
    working_dir: /app/backend
    volumes:
      - ../frontend/test-results/playwright-performance:/app/frontend/test-results/playwright-performance
      - ../frontend/test-results/listing-performance-perf:/app/frontend/test-results/listing-performance-perf
      - ../frontend/tests/playwright/performance:/out/report
    environment:
      PERF_RESULTS_DIR: /app/frontend/test-results/listing-performance-perf
      PERF_REPORT_DIR: /out/report
      PERF_GREP: ${PERF_GREP:-}
      PERF_BROWSERS: ${PERF_BROWSERS:-}
      # Local runs repeat each scenario and take the median to average out noise.
      # CI overrides this to 1 for fast feedback.
      PERF_REPEATS: ${PERF_REPEATS:-3}
      # Set to 1 to rewrite the committed chromium baseline from this run.
      PERF_UPDATE_BASELINE: ${PERF_UPDATE_BASELINE:-0}
      # Local comparisons are advisory unless explicitly enforced.
      PERF_ENFORCE_BASELINE: ${PERF_ENFORCE_BASELINE:-0}
      PERF_IMAGE_TAG: ${PERF_IMAGE_TAG:-local}
      PERF_IN_CONTAINER: "1"
    entrypoint:
      [
        "/bin/sh",
        "-c",
        "./filebrowser & sleep 5 && cd ../frontend && npx playwright test -c playwright.config.ts $${PERF_GREP:+-g \"$$PERF_GREP\"}",
      ]
    build:
      dockerfile: ./_docker/Dockerfile.playwright-performance
      target: perf
      context: ../
      args:
        PLAYWRIGHT_BASE_IMAGE: ${PLAYWRIGHT_BASE_IMAGE:-filebrowser-playwright-perf-base:latest}
  nginx-proxy-auth:
    image: nginx
    container_name: nginx-proxy-auth
    ports:
      - "80:80"
    volumes:
      - ./src/proxy/backend/default.conf:/etc/nginx/conf.d/default.conf
      - ./src/proxy/backend/.htpasswd:/etc/nginx/conf.d/.htpasswd
  nginx-proxy-jwt:
    image: nginx
    container_name: nginx-proxy-jwt
    ports:
      - "8081:8081"  # Admin user
      - "8082:8082"  # Regular user
      - "8083:8083"  # Wrong key
      - "8084:8084"  # No user
    volumes:
      - ./src/jwt/backend/default.conf:/etc/nginx/conf.d/default.conf
      - ./src/jwt/backend/.htpasswd:/etc/nginx/conf.d/.htpasswd
  filebrowser-jwt:
    hostname: filebrowser
    volumes:
      - '../frontend:/home/frontend'
      - "./src/jwt/backend/config.yaml:/home/filebrowser/data/config.yaml"
    build:
      context: ../
      dockerfile: ./_docker/Dockerfile.slim
  filebrowser:
    hostname: filebrowser
    volumes:
      - '../frontend:/home/frontend'
      - "./src/proxy/backend/config.yaml:/home/filebrowser/data/config.yaml"
    build:
      context: ../
      dockerfile: ./_docker/Dockerfile.slim
